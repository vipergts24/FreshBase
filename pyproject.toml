[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freshbase"
version = "0.1.0"
description = "Autonomous Semantic Code Collaboration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.9.0",
    "sqlalchemy>=2.0.0",
    "litellm>=1.0.0",
    "lancedb>=0.5.0",
    "openai>=1.0.0",
    "pytest>=8.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
fresh = "cli:app"

[tool.setuptools]
py-modules = ["cli"]
packages = ["core", "db"]

[tool.pytest.ini_options]
pythonpath = ["."]
